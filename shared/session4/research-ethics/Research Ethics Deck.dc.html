<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="_ds/aix-design-system-nyhima-2026-3ac245ed-ac08-4723-bf00-46ef755c6c41/colors_and_type.css">
<script src="_ds/aix-design-system-nyhima-2026-3ac245ed-ac08-4723-bf00-46ef755c6c41/_ds_bundle.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  html,body{margin:0;padding:0;background:#EDEAE3;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  @keyframes aixIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes aixFade{from{opacity:0}to{opacity:1}}
  a{color:var(--poly-navy);text-decoration:none;}
  a:hover{color:var(--poly-navy);text-decoration:underline;text-decoration-color:var(--poly-gold);text-underline-offset:3px;}
  ::selection{background:rgba(237,169,0,0.3);}
</style>
</helmet>
<div class="aix" style="font-family:var(--font-body);">
  <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">{{ app }}</sc-if>
  <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}">
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FAF8F3;color:#8A8578;font-family:var(--font-mono);font-size:12px;letter-spacing:0.12em;text-transform:uppercase;">Loading deck…</div>
  </sc-if>
  <sc-if value="{{ error }}" hint-placeholder-val="{{ false }}">{{ app }}</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:720},&quot;surface&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;navy&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;startBullet&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;first-shown&quot;,&quot;all-hidden&quot;],&quot;default&quot;:&quot;first-shown&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;link&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;tiny.cc/aix-ethics&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;srcEn&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;content/research-ethics-en.md&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;srcFr&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;content/research-ethics-fr.md&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;}}">
class Component extends DCLogic {
  state = { lang: 'en', i: 0, reveal: {}, menu: false, err: null, w: (typeof window !== 'undefined' ? window.innerWidth : 400) };

  COL = [
    { bar: '#4CC9F0', dark: '#0A5C73', tint: '#E8F8FD' },
    { bar: '#FFB347', dark: '#5C3600', tint: '#FFF3E0' },
    { bar: '#FF7096', dark: '#5C0020', tint: '#FFF0F3' },
  ];

  componentDidMount() {
    this._onKey = (e) => {
      if (this.state.menu) { if (e.key === 'Escape') this.setState({ menu: false }); return; }
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); this.next(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); this.prev(); }
    };
    document.addEventListener('keydown', this._onKey);
    this._onResize = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this._onResize);
    let lang = 'en', i = 0;
    try { const s = JSON.parse(localStorage.getItem('aix-ethics-pos') || '{}'); if (s.lang) lang = s.lang; if (typeof s.i === 'number') i = s.i; } catch (e) {}
    try { const p = new URLSearchParams(location.search); if (p.get('lang')) lang = p.get('lang'); } catch (e) {}
    this.setState({ lang, i });
    this.load(lang, i);
  }
  componentWillUnmount() { document.removeEventListener('keydown', this._onKey); window.removeEventListener('resize', this._onResize); }

  srcFor(lang) { return lang === 'fr' ? (this.props.srcFr || 'content/research-ethics-fr.md') : (this.props.srcEn || 'content/research-ethics-en.md'); }

  async load(lang, keepI) {
    try {
      const res = await fetch(this.srcFor(lang), { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const md = await res.text();
      const parsed = this.parse(md);
      parsed.slides = this.build(parsed);
      this._deck = parsed;
      const clampI = Math.max(0, Math.min(keepI || 0, parsed.slides.length - 1));
      this.setState({ lang, i: clampI, err: null });
    } catch (e) {
      this._deck = null;
      this.setState({ err: String(e.message || e) });
    }
  }

  parse(md) {
    const meta = {};
    let body = md;
    const fm = md.match(/^\uFEFF?---\s*\n([\s\S]*?)\n---\s*\n?/);
    if (fm) {
      fm[1].split('\n').forEach(l => {
        const m = l.match(/^([A-Za-z_]+):\s*(.*)$/);
        if (m) { let v = m[2].trim(); v = v.replace(/\s+#.*$/, '').trim(); v = v.replace(/^["']|["']$/g, ''); meta[m[1]] = v; }
      });
      body = md.slice(fm[0].length);
    }
    const branches = [], order = [];
    let branchIdx = 0, curBranch = null, curSection = null, colophon = null;
    body.split('\n').forEach(raw => {
      const line = raw.trim();
      if (!line) return;
      if (line.startsWith('# ')) { meta.headline = line.slice(2).trim(); return; }
      if (line.startsWith('## ')) { branchIdx++; curBranch = { n: branchIdx, title: line.slice(3).trim(), sections: [] }; branches.push(curBranch); curSection = null; return; }
      if (line.startsWith('### ')) { curSection = { kind: 'section', branch: branchIdx, title: line.slice(4).trim(), bullets: [] }; if (curBranch) curBranch.sections.push(curSection); order.push(curSection); return; }
      if (line.startsWith('> ')) { order.push({ kind: 'provocation', branch: branchIdx, text: line.slice(2).trim() }); return; }
      if (/^[-*+]\s+/.test(line)) { if (curSection) curSection.bullets.push(line.replace(/^[-*+]\s+/, '')); return; }
      if (line === '---') return;
      if (line.startsWith('*') && line.endsWith('*') && line.length > 2) { colophon = line.replace(/^\*+|\*+$/g, '').trim(); return; }
    });
    return { meta, branches, order, colophon };
  }

  // Breadth-first "full-fold": Level 1 (all branches) → Level 2 (each branch's sections) → Level 3 (each section's detail).
  build(d) {
    const slides = [{ type: 'title' }];
    slides.push({ type: 'level1', items: d.branches.map(b => ({ n: b.n, title: b.title })) });
    d.branches.forEach(b => slides.push({ type: 'level2', branch: b.n, title: b.title, items: b.sections.map(s => s.title) }));
    d.order.forEach(it => {
      if (it.kind === 'section') slides.push({ type: 'section', branch: it.branch, title: it.title, bullets: it.bullets });
      else slides.push({ type: 'provocation', branch: it.branch, text: it.text });
    });
    slides.push({ type: 'end', colophon: d.colophon });
    return slides;
  }

  save() { try { localStorage.setItem('aix-ethics-pos', JSON.stringify({ i: this.state.i, lang: this.state.lang })); } catch (e) {} }
  slides() { return this._deck ? this._deck.slides : []; }
  defReveal() { return this.props.startBullet === 'all-hidden' ? 0 : 1; }
  l2Index(n) { return this.slides().findIndex(x => x.type === 'level2' && x.branch === n); }
  l3Index(branch, title) { return this.slides().findIndex(x => x.type === 'section' && x.branch === branch && x.title === title); }

  goTo(i, full) {
    const S = this.slides();
    if (i < 0 || i >= S.length) return;
    const rev = { ...this.state.reveal };
    if (full) { const s = S[i]; if (s.type === 'section') rev[i] = s.bullets.length; }
    this.setState({ i, reveal: rev, menu: false }, () => this.save());
  }
  next() {
    const S = this.slides(); const i = this.state.i; const s = S[i];
    if (s && s.type === 'section') {
      const r = this.state.reveal[i] ?? this.defReveal();
      if (r < s.bullets.length) { this.setState({ reveal: { ...this.state.reveal, [i]: r + 1 } }); return; }
    }
    this.goTo(i + 1);
  }
  prev() { this.goTo(this.state.i - 1); }
  setLang(lang) { if (lang === this.state.lang) return; this.load(lang, this.state.i); this.setState({ lang }, () => this.save()); }

  theme() {
    if ((this.props.surface || 'light') === 'navy')
      return { navy: true, bg: '#002C73', head: '#fff', sub: 'rgba(255,255,255,0.85)', body: 'rgba(255,255,255,0.72)', meta: 'rgba(255,255,255,0.45)', rule: '#EDA900', edge: 'rgba(255,255,255,0.16)', card: 'rgba(255,255,255,0.05)' };
    return { navy: false, bg: '#FAF8F3', head: '#002C73', sub: '#002C73', body: '#555555', meta: '#8A8578', rule: '#EDA900', edge: '#E0DDD6', card: '#fff' };
  }
  bink(k) { const c = this.COL[(k - 1) % 3]; return this.theme().navy ? c.bar : c.dark; }
  btint(k) { const c = this.COL[(k - 1) % 3]; return this.theme().navy ? 'rgba(255,255,255,0.05)' : c.tint; }
  bbar(k) { return this.COL[(k - 1) % 3].bar; }
  shortBranch(t) { return (t || '').split(/[,:]/)[0]; }

  splitBullet(t) {
    let parts = t.split(/\s+—\s+|\s+–\s+/);
    if (parts.length > 1) return { lead: parts[0], detail: parts.slice(1).join(' — ') };
    const m = t.match(/^([^:]{1,34}):\s+(.*)$/);
    if (m) return { lead: m[1], detail: m[2] };
    return { lead: t, detail: '' };
  }

  progInfo(s) {
    if (s.type === 'title') return { mode: 'none' };
    if (s.type === 'level1') return { mode: 'all' };
    if (s.type === 'end') return { mode: 'done' };
    return { mode: 'cur', cur: s.branch || s.n || 1 };
  }

  renderVals() {
    const ready = !!this._deck;
    return {
      ready,
      loading: !ready && !this.state.err,
      error: !!this.state.err,
      app: ready ? this.renderApp() : (this.state.err ? this.renderErr() : null),
    };
  }

  renderErr() {
    const h = React.createElement, th = this.theme();
    return h('div', { style: { minHeight: '100vh', background: th.bg, color: th.body, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 32, textAlign: 'center', fontFamily: 'var(--font-body)' } },
      h('div', {},
        h('div', { style: { width: 32, height: 2, background: th.rule, margin: '0 auto 16px' } }),
        h('div', { style: { fontFamily: 'var(--font-display)', fontWeight: 600, fontSize: 22, color: th.head, marginBottom: 10 } }, "Couldn't load the deck"),
        h('div', { style: { fontSize: 14, marginBottom: 6 } }, 'Looking for: ' + this.srcFor(this.state.lang)),
        h('div', { style: { fontFamily: 'var(--font-mono)', fontSize: 12, color: th.meta } }, this.state.err))
    );
  }

  renderApp() {
    const h = React.createElement;
    const th = this.theme();
    const S = this.slides();
    const i = this.state.i;
    const s = S[i];
    const branches = this._deck.branches;
    const fr = this.state.lang === 'fr';
    const wide = this.state.w >= 700;
    const pi = this.progInfo(s);

    const segs = h('div', { style: { display: 'flex', gap: 4, flex: 1, maxWidth: 180 } },
      [0, 1, 2].map(k => {
        let filled = false, cur = false;
        if (pi.mode === 'all') { filled = true; cur = true; }
        else if (pi.mode === 'done') { filled = true; }
        else if (pi.mode === 'cur') { filled = pi.cur >= k + 1; cur = pi.cur === k + 1; }
        return h('div', { key: k, style: { flex: 1, height: 3, borderRadius: 2, background: filled ? this.bbar(k + 1) : th.edge, opacity: filled ? (cur || pi.mode === 'all' ? 1 : 0.5) : 1 } });
      })
    );

    let kicker;
    if (s.type === 'title') kicker = this._deck.meta.title || '';
    else if (s.type === 'level1') kicker = fr ? "Niveau 1 · L'arbre entier" : 'Level 1 · The whole tree';
    else if (s.type === 'level2') kicker = (fr ? 'Niveau 2' : 'Level 2') + ' · ' + String(s.branch).padStart(2, '0') + ' ' + this.shortBranch(s.title);
    else if (s.type === 'section') kicker = (fr ? 'Niveau 3' : 'Level 3') + ' · ' + String(s.branch).padStart(2, '0') + ' ' + this.shortBranch((branches[s.branch - 1] || {}).title);
    else if (s.type === 'provocation') kicker = String(s.branch || '').padStart(2, '0');
    else kicker = fr ? 'Fin' : 'Close';

    const header = h('div', { style: { display: 'flex', alignItems: 'center', gap: 12, padding: '14px 20px', borderBottom: '1px solid ' + th.edge, flex: '0 0 auto' } },
      segs,
      h('div', { style: { flex: 1, minWidth: 0, fontFamily: 'var(--font-mono)', fontSize: 10.5, letterSpacing: '0.12em', textTransform: 'uppercase', color: th.meta, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' } }, kicker),
      h('div', { style: { display: 'flex', gap: 6, alignItems: 'center', flex: '0 0 auto' } },
        h('button', { onClick: () => this.setLang('en'), style: this.langBtn('en') }, 'EN'),
        h('span', { style: { color: th.edge, fontSize: 11 } }, '/'),
        h('button', { onClick: () => this.setLang('fr'), style: this.langBtn('fr') }, 'FR'),
        h('button', { 'aria-label': 'Menu', onClick: () => this.setState({ menu: true }), style: { marginLeft: 6, background: 'none', border: 'none', cursor: 'pointer', padding: 4, display: 'flex', flexDirection: 'column', gap: 3.5 } },
          [0, 1, 2].map(k => h('span', { key: k, style: { display: 'block', width: 18, height: 1.6, background: th.head } })))
      )
    );

    const body = h('div', {
      onClick: () => { if (this._swiped) { this._swiped = false; return; } this.next(); },
      onTouchStart: (e) => { const t = e.touches[0]; this._tx = t.clientX; this._ty = t.clientY; },
      onTouchEnd: (e) => {
        const t = e.changedTouches[0]; const dx = t.clientX - this._tx; const dy = t.clientY - this._ty;
        if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) { this._swiped = true; if (dx < 0) this.next(); else this.prev(); }
      },
      style: { flex: 1, position: 'relative', overflow: 'hidden', cursor: 'pointer' }
    },
      h('div', { key: i, style: { position: 'absolute', inset: 0, overflowY: 'auto', animation: 'aixIn 0.34s ease both' } }, this.renderSlide(s, i, th)),
      h('div', { onClick: (e) => { e.stopPropagation(); this.prev(); }, style: { position: 'absolute', left: 0, top: 0, bottom: 0, width: '16%' } }),
      h('div', { onClick: (e) => { e.stopPropagation(); this.goTo(i + 1); }, style: { position: 'absolute', right: 0, top: 0, bottom: 0, width: '16%' } })
    );

    const footer = h('div', { style: { display: 'flex', alignItems: 'center', gap: 12, padding: '12px 20px', borderTop: '1px solid ' + th.edge, flex: '0 0 auto' } },
      h('button', { 'aria-label': 'Previous', onClick: () => this.prev(), disabled: i === 0, style: this.navBtn(th, i === 0) }, '‹'),
      h('div', { style: { flex: 1, textAlign: 'center', fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '0.1em', color: th.meta } },
        String(i + 1).padStart(2, '0') + ' / ' + String(S.length).padStart(2, '0')),
      h('button', { 'aria-label': 'Next', onClick: () => this.next(), disabled: i === S.length - 1, style: this.navBtn(th, i === S.length - 1) }, '›')
    );

    const stage = h('div', { style: { width: '100%', maxWidth: 540, height: wide ? '92vh' : '100vh', maxHeight: wide ? 940 : 'none', background: th.bg, color: th.body, position: 'relative', display: 'flex', flexDirection: 'column', overflow: 'hidden', boxShadow: wide ? '0 12px 48px rgba(0,0,0,0.16)' : 'none', border: wide ? '1px solid ' + th.edge : 'none', borderRadius: wide ? 14 : 0 } },
      header, body, footer, this.state.menu ? this.renderMenu(th) : null);

    return h('div', { style: { minHeight: '100vh', display: 'flex', alignItems: wide ? 'center' : 'stretch', justifyContent: 'center', background: wide ? '#EDEAE3' : th.bg } }, stage);
  }

  langBtn(l) {
    const th = this.theme(); const on = this.state.lang === l;
    return { background: 'none', border: 'none', cursor: 'pointer', fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '0.08em', padding: '2px 2px', color: on ? th.head : th.meta, fontWeight: on ? 500 : 400, borderBottom: on ? '1.5px solid ' + th.rule : '1.5px solid transparent' };
  }
  navBtn(th, dis) {
    return { width: 38, height: 38, borderRadius: 19, border: '1px solid ' + th.edge, background: 'transparent', color: dis ? th.edge : th.head, fontSize: 20, lineHeight: '1', cursor: dis ? 'default' : 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'var(--font-display)', flex: '0 0 auto' };
  }
  goldRule(th, color) { return React.createElement('div', { style: { width: 32, height: 2, background: color || th.rule, marginBottom: 20, flex: '0 0 auto' } }); }
  pad(extra) { return Object.assign({ minHeight: '100%', display: 'flex', flexDirection: 'column', padding: '38px 30px 32px' }, extra || {}); }
  hint(th, txt) { return React.createElement('div', { style: { marginTop: 22, display: 'flex', alignItems: 'center', gap: 7, fontFamily: 'var(--font-mono)', fontSize: 10.5, letterSpacing: '0.11em', textTransform: 'uppercase', color: th.meta } }, txt, React.createElement('span', { style: { fontSize: 14 } }, '→')); }

  renderSlide(s, idx, th) {
    const h = React.createElement;
    const meta = this._deck.meta;
    const branches = this._deck.branches;
    const fr = this.state.lang === 'fr';

    if (s.type === 'title') {
      return h('div', { style: this.pad({ justifyContent: 'space-between' }) },
        h('div', {},
          h('div', { style: { fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '0.14em', textTransform: 'uppercase', color: th.meta, marginBottom: 26 } }, meta.title || ''),
          this.goldRule(th),
          h('h1', { style: { fontFamily: 'var(--font-display)', fontWeight: 600, fontSize: 'clamp(30px,8.6vw,46px)', lineHeight: 1.12, color: th.head, margin: 0, textWrap: 'balance' } }, meta.headline || ''),
          meta.context ? h('div', { style: { marginTop: 18, fontSize: 'clamp(15px,4.4vw,18px)', color: th.body, lineHeight: 1.5 } }, meta.context) : null
        ),
        h('div', {},
          h('div', { style: { fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '0.06em', color: th.meta, lineHeight: 1.9 } },
            (meta.author || ''), h('br'),
            (meta.date || ''), (meta.link ? h('span', {}, '  ·  ', h('span', { style: { color: th.sub } }, meta.link)) : null)),
          h('div', { style: { animation: 'aixFade 1.4s ease both' } }, this.hint(th, fr ? 'Balayez pour commencer' : 'Swipe to begin'))
        )
      );
    }

    // LEVEL 1 — the whole tree, all three branches at once
    if (s.type === 'level1') {
      return h('div', { style: this.pad({ justifyContent: 'center' }) },
        h('div', { style: { fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '0.14em', textTransform: 'uppercase', color: th.meta, marginBottom: 16 } }, fr ? 'Les trois exigences' : 'The three requirements'),
        this.goldRule(th),
        h('h1', { style: { fontFamily: 'var(--font-display)', fontWeight: 600, fontSize: 'clamp(22px,6.2vw,32px)', lineHeight: 1.16, color: th.head, margin: '0 0 26px', textWrap: 'balance' } }, meta.headline || ''),
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: 20 } },
          s.items.map((b, k) => h('button', { key: k, onClick: (e) => { e.stopPropagation(); this.goTo(this.l2Index(b.n), true); }, style: { textAlign: 'left', background: 'none', border: 'none', cursor: 'pointer', padding: 0, display: 'flex', gap: 14, alignItems: 'baseline', animation: 'aixIn 0.3s ease both' } },
            h('span', { style: { fontFamily: 'var(--font-display)', fontWeight: 600, fontSize: 'clamp(20px,6vw,28px)', color: this.bink(b.n), flex: '0 0 auto', lineHeight: 1 } }, String(b.n).padStart(2, '0')),
            h('span', { style: { fontFamily: 'var(--font-display)', fontWeight: 600, fontSize: 'clamp(19px,5.4vw,26px)', color: th.head, lineHeight: 1.22, textWrap: 'balance' } }, b.title)
          ))
        ),
        this.hint(th, fr ? 'Déployez niveau par niveau' : 'Unfold level by level')
      );
    }

    // LEVEL 2 — one branch's sections (its children)
    if (s.type === 'level2') {
      const ink = this.bink(s.branch), bar = this.bbar(s.branch);
      return h('div', { style: this.pad({}) },
        h('div', { style: { fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '0.13em', textTransform: 'uppercase', color: ink, marginBottom: 10, display: 'flex', alignItems: 'center', gap: 8 } },
          h('span', { style: { width: 18, height: 3, background: bar, display: 'inline-block' } }),
          (fr ? 'Partie' : 'Part') + ' ' + String(s.branch).padStart(2, '0') + ' / ' + String(branches.length).padStart(2, '0')),
        h('h2', { style: { fontFamily: 'var(--font-display)', fontWeight: 600, fontSize: 'clamp(23px,6.4vw,32px)', lineHeight: 1.16, color: th.head, margin: '0 0 24px', textWrap: 'balance' } }, s.title),
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: 14, flex: 1 } },
          s.items.map((t, k) => h('button', { key: k, onClick: (e) => { e.stopPropagation(); this.goTo(this.l3Index(s.branch, t), true); }, style: { textAlign: 'left', background: 'none', border: 'none', cursor: 'pointer', padding: 0, display: 'flex', gap: 12, alignItems: 'baseline', animation: 'aixIn 0.3s ease both' } },
            h('span', { style: { fontFamily: 'var(--font-mono)', fontSize: 12, color: ink, flex: '0 0 auto', fontWeight: 500 } }, String(s.branch).padStart(2, '0') + '.' + (k + 1)),
            h('span', { style: { fontFamily: 'var(--font-body)', fontWeight: 400, fontSize: 'clamp(17px,4.9vw,22px)', color: th.head, lineHeight: 1.3, textWrap: 'pretty' } }, t)
          ))
        ),
        this.hint(th, fr ? 'Un point pour le détail' : 'Tap a point for detail')
      );
    }

    if (s.type === 'provocation') {
      const bar = s.branch ? this.bbar(s.branch) : th.rule;
      return h('div', { style: this.pad({ justifyContent: 'center', alignItems: 'flex-start' }) },
        h('div', { style: { width: 40, height: 3, background: bar, marginBottom: 26 } }),
        h('blockquote', { style: { margin: 0, fontFamily: 'var(--font-display)', fontStyle: 'italic', fontWeight: 400, fontSize: 'clamp(27px,7.8vw,42px)', lineHeight: 1.28, color: th.sub, textWrap: 'pretty' } }, s.text)
      );
    }

    if (s.type === 'end') {
      let url = (this.props.link || meta.link || '').trim();
      if (url && !/^https?:\/\//.test(url)) url = 'https://' + url;
      let svg = '';
      try { if (url && window.qrcode) { const q = window.qrcode(0, 'M'); q.addData(url); q.make(); svg = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } } catch (e) {}
      return h('div', { style: this.pad({ justifyContent: 'center', alignItems: 'center', textAlign: 'center' }) },
        this.goldRule(th, null),
        h('div', { style: { fontFamily: 'var(--font-display)', fontWeight: 600, fontSize: 'clamp(24px,6.6vw,34px)', color: th.head, lineHeight: 1.18, marginBottom: 24, textWrap: 'balance' } }, meta.headline || ''),
        svg ? h('div', { style: { width: 148, height: 148, padding: 12, background: '#fff', borderRadius: 10, border: '1px solid ' + th.edge, marginBottom: 16 }, dangerouslySetInnerHTML: { __html: svg.replace('<svg', '<svg width="124" height="124"') } }) : null,
        (this.props.link || meta.link) ? h('div', { style: { fontFamily: 'var(--font-mono)', fontSize: 13, letterSpacing: '0.06em', color: th.sub, marginBottom: 28 } }, (this.props.link || meta.link)) : null,
        h('button', { onClick: (e) => { e.stopPropagation(); this.goTo(0); }, style: { fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '0.12em', textTransform: 'uppercase', color: th.head, background: 'transparent', border: '1px solid ' + th.edge, borderRadius: 20, padding: '9px 18px', cursor: 'pointer', marginBottom: 30 } }, fr ? 'Recommencer' : 'Start over'),
        s.colophon ? h('div', { style: { fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.06em', color: th.meta, lineHeight: 1.9, maxWidth: 380 } }, s.colophon) : null
      );
    }

    // LEVEL 3 — a section's detail (StretchText: reveal bullets one at a time)
    const ink = this.bink(s.branch), bar = this.bbar(s.branch);
    const rev = this.state.reveal[idx] ?? this.defReveal();
    const shown = s.bullets.slice(0, rev);
    const remaining = s.bullets.length - rev;
    return h('div', { style: this.pad({}) },
      h('div', { style: { fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '0.13em', textTransform: 'uppercase', color: ink, marginBottom: 14, display: 'flex', alignItems: 'center', gap: 8 } },
        h('span', { style: { width: 18, height: 3, background: bar, display: 'inline-block' } }),
        (fr ? 'Niveau 3' : 'Level 3') + ' · ' + String(s.branch).padStart(2, '0')),
      h('h2', { style: { fontFamily: 'var(--font-display)', fontWeight: 600, fontSize: 'clamp(23px,6.6vw,33px)', lineHeight: 1.16, color: th.head, margin: '0 0 22px', textWrap: 'balance' } }, s.title),
      h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16, flex: 1 } },
        shown.map((b, bi) => {
          const parts = this.splitBullet(b);
          const plain = !parts.detail && parts.lead.length > 44;
          return h('div', { key: 'b' + bi, style: { animation: 'aixIn 0.32s ease both', display: 'flex', gap: 12 } },
            h('div', { style: { flex: '0 0 auto', width: 7, height: 7, borderRadius: 4, background: bar, marginTop: 'clamp(8px,2.4vw,11px)' } }),
            h('div', { style: { flex: 1 } },
              plain
                ? h('div', { style: { fontSize: 'clamp(16px,4.6vw,20px)', lineHeight: 1.5, color: th.body, fontWeight: 300, textWrap: 'pretty' } }, parts.lead)
                : h('div', {},
                  h('span', { style: { fontFamily: 'var(--font-body)', fontWeight: 500, fontSize: 'clamp(18px,5vw,23px)', color: th.head, lineHeight: 1.3 } }, parts.lead),
                  parts.detail ? h('div', { style: { marginTop: 5, fontSize: 'clamp(15px,4.3vw,18px)', lineHeight: 1.5, color: th.body, fontWeight: 300, textWrap: 'pretty' } }, parts.detail) : null)
            )
          );
        })
      ),
      remaining > 0
        ? h('div', { style: { marginTop: 20, display: 'flex', alignItems: 'center', gap: 8, fontFamily: 'var(--font-mono)', fontSize: 10.5, letterSpacing: '0.1em', textTransform: 'uppercase', color: th.meta } },
          h('div', { style: { display: 'flex', gap: 5 } }, Array.from({ length: remaining }).map((_, k) => h('span', { key: k, style: { width: 6, height: 6, borderRadius: 3, border: '1px solid ' + th.meta, opacity: 0.6 } }))),
          h('span', {}, (fr ? 'Touchez — encore ' : 'Tap — ') + remaining + (fr ? '' : ' more')))
        : this.hint(th, fr ? 'Suivant' : 'Next')
    );
  }

  renderMenu(th) {
    const h = React.createElement;
    const S = this.slides();
    const fr = this.state.lang === 'fr';
    const meta = this._deck.meta;
    const rows = [];
    this._deck.branches.forEach((br, bi) => {
      rows.push(h('button', { key: 'br' + br.n, onClick: () => this.goTo(this.l2Index(br.n), true), style: { textAlign: 'left', background: 'none', border: 'none', cursor: 'pointer', padding: '16px 0 8px', display: 'flex', gap: 12, alignItems: 'baseline', borderTop: bi ? '1px solid ' + th.edge : 'none' } },
        h('span', { style: { fontFamily: 'var(--font-mono)', fontSize: 12, color: this.bink(br.n), fontWeight: 500, flex: '0 0 auto' } }, String(br.n).padStart(2, '0')),
        h('span', { style: { fontFamily: 'var(--font-display)', fontWeight: 600, fontSize: 17, color: th.head, lineHeight: 1.25 } }, br.title)
      ));
      br.sections.forEach((se, si) => {
        const xi = this.l3Index(br.n, se.title);
        const active = xi === this.state.i;
        rows.push(h('button', { key: 'sec' + br.n + '_' + si, onClick: () => this.goTo(xi, true), style: { textAlign: 'left', background: active ? this.btint(br.n) : 'none', border: 'none', cursor: 'pointer', padding: '9px 10px 9px 34px', margin: '0 -10px', borderRadius: 8, fontSize: 15, fontWeight: active ? 500 : 300, color: active ? th.head : th.body, lineHeight: 1.35 } }, se.title));
      });
    });
    return h('div', { style: { position: 'absolute', inset: 0, background: th.bg, zIndex: 20, display: 'flex', flexDirection: 'column', animation: 'aixFade 0.2s ease both' } },
      h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '14px 20px', borderBottom: '1px solid ' + th.edge, flex: '0 0 auto' } },
        h('div', { style: { fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '0.13em', textTransform: 'uppercase', color: th.meta } }, fr ? 'Sommaire' : 'Contents'),
        h('button', { 'aria-label': 'Close', onClick: () => this.setState({ menu: false }), style: { background: 'none', border: 'none', cursor: 'pointer', fontSize: 26, color: th.head, lineHeight: 1, padding: 0, width: 32 } }, '×')
      ),
      h('div', { style: { flex: 1, overflowY: 'auto', padding: '4px 24px 20px' } },
        h('button', { onClick: () => this.goTo(1, true), style: { textAlign: 'left', background: 'none', border: 'none', cursor: 'pointer', padding: '16px 0', display: 'block', width: '100%' } },
          h('div', { style: { width: 28, height: 2, background: th.rule, marginBottom: 10 } }),
          h('div', { style: { fontFamily: 'var(--font-display)', fontWeight: 600, fontSize: 18, color: th.head, lineHeight: 1.2 } }, meta.headline || '')),
        h('div', { style: { display: 'flex', flexDirection: 'column' } }, rows),
        h('button', { onClick: () => this.goTo(S.length - 1, true), style: { textAlign: 'left', background: 'none', border: 'none', cursor: 'pointer', padding: '16px 0 8px', borderTop: '1px solid ' + th.edge, marginTop: 4, fontFamily: 'var(--font-mono)', fontSize: 12, letterSpacing: '0.1em', textTransform: 'uppercase', color: th.meta, width: '100%' } }, fr ? 'Fin · lien & QR' : 'Close · link & QR')
      )
    );
  }
}
</script>
</body>
</html>
